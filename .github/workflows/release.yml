# Builds the app for Windows, macOS and Linux and publishes one GitHub Release
# with all three archives.
#
# How to trigger it: push a version tag, e.g.
#   git tag v1.0.0
#   git push origin v1.0.0
#
# You can also run it by hand from the "Actions" tab (Run workflow);
# a manual run only builds the archives and keeps them as downloadable
# artifacts, it doesn't create a release.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Step 1: build on three machines at the same time.
  build:
    strategy:
      fail-fast: false # one failing system doesn't cancel the others
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # build.js picks the system, version (from the tag) and icon by itself,
      # then packs the app into Messenger-<version>-<os>-<arch>.zip / .tar.gz
      - name: Build and archive
        run: npm run dist

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: |
            Messenger-*.zip
            Messenger-*.tar.gz
          if-no-files-found: error

  # Step 2: once all three builds are done, collect them into one release.
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release

    steps:
      - name: Download all archives
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
